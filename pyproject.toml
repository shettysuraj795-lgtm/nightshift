[project]
name = "nightshift"
version = "0.1.0"
description = "AI triage assistant for failed overnight batch jobs (demo, synthetic data)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.1",
    "fastembed==0.9.0",
    "openai==3.31.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyyaml==6.0.3",
    "qdrant-client==1.19.1",
    "requests==2.34.2",
    "streamlit==1.66.0",
    "tenacity==9.2.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

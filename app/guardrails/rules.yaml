# Guardrail rules, kept as data so they can be reviewed without reading code.
# All patterns are Python regular expressions, matched case-insensitively.

# Text that tries to instruct the model rather than describe a failure.
injection_patterns:
  - "ignore (?:all |any |your |previous |prior |the )*(?:instructions|rules|guidelines)"
  - "disregard (?:all |any |your |previous |prior |the )*(?:instructions|rules|guidelines)"
  - "note to (?:the )?(?:ai|assistant|model|llm)"
  - "you are now"
  - "(?:new|updated) system prompt"
  - "reply (?:only )?with [A-Z]+-\\d+"

# How each forbidden action from the registry shows up in a step's text.
# Every forbidden_actions identifier in data/registry.yaml needs an entry here
# (tests/test_guardrails.py checks this).
forbidden_action_patterns:
  delete_lock_entry:
    - "\\b(?:delet|remov|clear|drop|releas)\\w*\\b.*\\b(?:lock|enqueue)"
    - "\\bunlock\\w*"
    - "\\bSM12\\b"
  create_placeholder_file:
    - "\\b(?:creat|upload|plac|add)\\w*\\b.*\\b(?:placeholder|dummy|empty|fake)\\b.*\\bfile"
  edit_idoc_segment:
    - "\\b(?:edit|modif|chang|overwrit)\\w*\\b.*\\bsegment"
  assign_sap_all:
    - "\\bSAP_ALL\\b"
  rerun_during_shift_start:
    - "\\b(?:during|at)\\s+(?:the\\s+)?(?:morning\\s+)?shift\\s+start"
  drop_table:
    - "\\bdrop\\w*\\b.*\\btables?\\b"
  truncate_table:
    - "\\btruncat\\w*"
  purge_history:
    - "\\bpurg\\w*"
  disable_tls_verification:
    - "\\bdisabl\\w*\\b.*\\b(?:certificate|tls|ssl)"

# A clause that starts with a warning ("Do not ...", "Never ...") is not a
# recommendation. Steps are split into clauses first, so "Do not wait; delete
# the lock entry" is still caught, and a warning word later in a clause
# ("Delete the lock entry to avoid ...") does not excuse it.
clause_separator: "[.;:!?]|,\\s*(?:but|then|and then)\\b|\\s[-–—]\\s"
negation_start: "^\\s*(?:do not|don't|never|must not|should not|avoid)\\b"

# What a step's text says it does, whatever action tag the model put on it.
# The stricter of the tag and the text wins, so a rerun labelled "info" is
# still treated as a rerun. Checked only in clauses that are not warnings.
action_text_patterns:
  rerun_job:
    - "\\b(?:re-?run|reprocess|restart|re-?trigger|resubmit|retry|re-?start)\\w*"
  config_change:
    # Only when the clause starts with the verb: "Raise a change request" is
    # an escalation, not a change (decision 2026-10-15).
    - "^\\s*(?:change|modify|update|edit|extend|assign|increase|add|set|grant)\\b"
